name: Release

# Tag-driven release: pushing a `vX.Y.Z` tag checks the code and then creates a
# GitHub Release for the tag. No binaries are built or attached: GitHub adds
# "Source code (zip)" and "Source code (tar.gz)" archives to every Release, so
# users can download the source without cloning and build it with
# `cargo build --release`. A tag with a suffix (`v0.3.0-rc.1`) is published
# as a pre-release.

on:
  push:
    tags: ["v[0-9]*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# Same pin policy as ci.yml: every `uses:` is a full commit SHA with the release
# in a trailing comment.

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The tag must match the crate version, so the archive's Cargo.toml and
      # `snapshot-replicator --version` report what the Release is called.
      - name: Check tag matches Cargo.toml version
        run: |
          crate_version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$crate_version" != "$tag_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $crate_version" >&2
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master as of 2026-10-09
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # The archive users download must build and pass its tests as-is.
      - run: cargo test --locked --all-targets
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          command: check

  # The only job that writes to the repo.
  release:
    name: GitHub Release
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            $prerelease
